services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: replo
      POSTGRES_PASSWORD: replo
      POSTGRES_DB: replo
    ports: ["5432:5432"]
    volumes: ["replo_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  replo_pg:
